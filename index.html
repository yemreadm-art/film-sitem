  <header>
    <a class="logo" href="./index.html">Fl<span>i</span>x</a>
    <a class="admin" href="./admin.html">Yönetim Paneli</a>
  </header>

  <main>
    <div class="heading">
      <h1>Film Arşivi</h1>
      <input id="search" type="search" placeholder="Film ara...">
    </div>
    <p id="status">Filmler yükleniyor...</p>
    <div id="movies" class="movies"></div>
  </main>

  <footer>Flix Film Arşivi</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://uiyygffttyzkwzsjgmog.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ea9e2nv1qrNkSYGq_SjKUQ_E4b4Cie5";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const movieList = document.getElementById("movies");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    let allMovies = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[ch]));
    }

    function renderMovies() {
      const term = search.value.trim().toLocaleLowerCase("tr-TR");
      const filtered = allMovies.filter(m =>
        String(m.title || "").toLocaleLowerCase("tr-TR").includes(term) ||
        String(m.genre || "").toLocaleLowerCase("tr-TR").includes(term) ||
        String(m.year || "").includes(term)
      );

      movieList.innerHTML = "";

      if (!filtered.length) {
        status.textContent = allMovies.length
          ? "Aramana uygun film bulunamadı."
          : "Henüz film eklenmemiş. Yönetim panelinden film ekleyebilirsin.";
        return;
      }

      status.textContent = filtered.length + " film";

      filtered.forEach(m => {
        const card = document.createElement("article");
        card.className = "movie";
        card.tabIndex = 0;
        card.setAttribute("role", "link");
        card.setAttribute("aria-label", m.title + " filmini izle");

        const poster = m.poster
          ? `<img class="poster" src="${escapeHTML(m.poster)}" alt="${escapeHTML(m.title)} afişi" loading="lazy" onerror="this.outerHTML='<div class=&quot;no-poster&quot;>Afiş bulunamadı</div>'">`
          : `<div class="no-poster">Afiş eklenmemiş</div>`;

        card.innerHTML = `
          ${poster}
          <div class="info">
            <p class="title">${escapeHTML(m.title)}</p>
            <div class="meta">${escapeHTML(m.year || "")}${m.genre ? " · " + escapeHTML(m.genre) : ""}${m.rating ? " · ★ " + escapeHTML(m.rating) : ""}</div>
            <a class="play" href="./watch.html?id=${encodeURIComponent(m.id)}">▶ Filmi İzle</a>
          </div>`;

        const openMovie = event => {
          if (event.target.closest("a")) return;
          window.location.href = "./watch.html?id=" + encodeURIComponent(m.id);
        };
        card.addEventListener("click", openMovie);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openMovie(event);
          }
        });

        movieList.appendChild(card);
      });
    }

    async function loadMovies() {
      const { data, error } = await db
        .from("movies")
        .select("id,title,youtube,genre,year,rating,poster,description,featured,created_at")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "Filmler yüklenemedi: " + error.message;
        return;
      }

      allMovies = data || [];
      renderMovies();
    }

    search.addEventListener("input", renderMovies);
    loadMovies();
  </script>
</body>
</html>
