
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Film İzle | BengüşFlix</title>

<style>
:root {
  --arka: #101014;
  --kart: #1b1b23;
  --kirmizi: #e74752;
  --yazi: #f6f6f8;
  --soluk: #aaaab6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--arka);
  color: var(--yazi);
  font-family: Arial, Helvetica, sans-serif;
}

a { color: inherit; text-decoration: none; }

.ust-menu {
  background: #17171d;
  border-bottom: 1px solid #292932;
}

.menu-icerik {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  display: inline-block;
  color: #f6f6f8 !important;
  font-size: 25px;
  font-weight: 900;
  line-height: 1.3;
  white-space: nowrap;
}

.logo span { color: #e74752 !important; }

.geri {
  color: #ff737c;
  font-size: 14px;
  font-weight: bold;
}

.ana-icerik {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px 60px;
}

.durum {
  color: var(--soluk);
  line-height: 1.8;
  padding: 20px 0;
}

.film-baslik {
  font-size: clamp(27px, 5vw, 42px);
  margin: 0 0 12px;
}

.film-detay {
  color: var(--soluk);
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 24px;
}

.video-kapsayici {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #292932;
}

.video-kapsayici iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.aciklama {
  margin-top: 25px;
  color: #d1d1da;
  line-height: 1.8;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.afis {
  width: 150px;
  max-width: 40%;
  border-radius: 8px;
  margin-top: 25px;
}

/* Yorum alanı */
.yorum-bolumu {
  margin-top: 35px;
  padding-top: 28px;
  border-top: 1px solid #292932;
}

.yorum-baslik {
  font-size: 25px;
  margin: 0 0 8px;
}

.yorum-alt-baslik {
  color: var(--soluk);
  font-size: 14px;
  margin: 0 0 22px;
}

.yorum-form {
  background: var(--kart);
  border: 1px solid #30303a;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 25px;
}

.form-alan {
  display: block;
  width: 100%;
  margin-bottom: 14px;
}

.form-alan label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: bold;
}

.form-alan input,
.form-alan textarea {
  width: 100%;
  padding: 13px 14px;
  color: var(--yazi);
  background: #111116;
  border: 1px solid #393943;
  border-radius: 8px;
  font: inherit;
  outline: none;
}

.form-alan input:focus,
.form-alan textarea:focus {
  border-color: var(--kirmizi);
}

.form-alan textarea {
  min-height: 110px;
  resize: vertical;
}

.yorum-gonder {
  display: inline-block;
  padding: 12px 22px;
  background: var(--kirmizi);
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.yorum-gonder:hover { background: #ce3540; }

.yorum-gonder:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.yorum-mesaj {
  color: var(--soluk);
  font-size: 14px;
  line-height: 1.6;
  margin-top: 12px;
}

.yorum-listesi {
  display: grid;
  gap: 14px;
}

.yorum-kart {
  background: var(--kart);
  border: 1px solid #292932;
  border-radius: 10px;
  padding: 17px;
  overflow-wrap: anywhere;
}

.yorum-ust {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.yorum-isim {
  font-weight: bold;
  color: #fff;
}

.yorum-tarih {
  color: var(--soluk);
  font-size: 12px;
}

.yorum-metni {
  color: #d8d8e0;
  line-height: 1.7;
  white-space: pre-wrap;
  margin: 0;
}

.alt-bilgi {
  border-top: 1px solid #292932;
  padding: 25px 20px;
  text-align: center;
  color: var(--soluk);
  font-size: 13px;
}

@media (max-width: 600px) {
  .menu-icerik {
    align-items: flex-start;
    flex-direction: column;
  }

  .ana-icerik { padding: 22px 14px 40px; }

  .video-kapsayici { border-radius: 7px; }

  .yorum-form { padding: 14px; }

  .yorum-ust {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
  }
}
</style>
</head>

<body>

<header class="ust-menu">
  <div class="menu-icerik">
    <a class="logo" href="./index.html" aria-label="BengüşFlix ana sayfa">
      Bengüş<span>Flix</span>
    </a>

    <a class="geri" href="./index.html#filmler">
      ← Film arşivine dön
    </a>
  </div>
</header>

<main class="ana-icerik">
  <p class="durum" id="film-durumu">Film yükleniyor...</p>

  <section id="film-icerigi" hidden>
    <h1 class="film-baslik" id="film-baslik"></h1>
    <div class="film-detay" id="film-detay"></div>

    <div class="video-kapsayici" id="video-kapsayici"></div>

    <img class="afis" id="film-afis" alt="Film afişi" hidden>

    <p class="aciklama" id="film-aciklama"></p>

    <!-- Yorum alanı -->
    <section class="yorum-bolumu" aria-labelledby="yorum-baslik">
      <h2 class="yorum-baslik" id="yorum-baslik">Yorumlar</h2>
      <p class="yorum-alt-baslik">Film hakkındaki düşünceni paylaş.</p>

      <form class="yorum-form" id="yorum-form">
        <div class="form-alan">
          <label for="yorum-isim">İsmin</label>
          <input
            id="yorum-isim"
            name="name"
            type="text"
            maxlength="60"
            placeholder="İsmini yaz..."
            autocomplete="nickname"
            required
          >
        </div>

        <div class="form-alan">
          <label for="yorum-metni">Yorumun</label>
          <textarea
            id="yorum-metni"
            name="comment"
            maxlength="1000"
            placeholder="Bu film hakkında ne düşünüyorsun?"
            required
          ></textarea>
        </div>

        <button class="yorum-gonder" id="yorum-gonder" type="submit">
          Yorumu yayınla
        </button>

        <p class="yorum-mesaj" id="yorum-mesaj" role="status" aria-live="polite"></p>
      </form>

      <div class="yorum-listesi" id="yorum-listesi">
        <p class="durum">Yorumlar yükleniyor...</p>
      </div>
    </section>
  </section>
</main>

<footer class="alt-bilgi">
  © 2026 BengüşFlix
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
(async function () {
  const durum = document.getElementById("film-durumu");
  const icerik = document.getElementById("film-icerigi");
  const baslik = document.getElementById("film-baslik");
  const detay = document.getElementById("film-detay");
  const videoKapsayici = document.getElementById("video-kapsayici");
  const afis = document.getElementById("film-afis");
  const aciklama = document.getElementById("film-aciklama");

  const yorumForm = document.getElementById("yorum-form");
  const yorumIsim = document.getElementById("yorum-isim");
  const yorumMetni = document.getElementById("yorum-metni");
  const yorumGonder = document.getElementById("yorum-gonder");
  const yorumMesaj = document.getElementById("yorum-mesaj");
  const yorumListesi = document.getElementById("yorum-listesi");

  function hataGoster(mesaj) {
    durum.hidden = false;
    durum.textContent = mesaj;
    icerik.hidden = true;
  }

  function youtubeVideoId(adres) {
    if (!adres) return null;

    try {
      const url = new URL(adres);
      const host = url.hostname.toLowerCase().replace(/^www\./, "");
      let id = "";

      if (host === "youtu.be") {
        id = url.pathname.split("/").filter(Boolean)[0] || "";
      } else if (
        host === "youtube.com" ||
        host === "m.youtube.com" ||
        host === "youtube-nocookie.com"
      ) {
        if (url.pathname === "/watch") {
          id = url.searchParams.get("v") || "";
        } else {
          const parcalar = url.pathname.split("/").filter(Boolean);
          if (["embed", "shorts", "live"].includes(parcalar[0])) {
            id = parcalar[1] || "";
          }
        }
      }

      return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
    } catch (_) {
      return null;
    }
  }

  function mesajGoster(metin, hata = false) {
    yorumMesaj.textContent = metin;
    yorumMesaj.style.color = hata ? "#ff737c" : "var(--soluk)";
  }

  function tarihFormatla(tarih) {
    if (!tarih) return "";

    const tarihNesnesi = new Date(tarih);
    if (Number.isNaN(tarihNesnesi.getTime())) return "";

    return tarihNesnesi.toLocaleString("tr-TR", {
      dateStyle: "short",
      timeStyle: "short"
    });
  }

  function yorumKartiniEkle(yorum) {
    const kart = document.createElement("article");
    kart.className = "yorum-kart";

    const ust = document.createElement("div");
    ust.className = "yorum-ust";

    const isim = document.createElement("span");
    isim.className = "yorum-isim";
    isim.textContent = yorum.name;

    const tarih = document.createElement("time");
    tarih.className = "yorum-tarih";
    tarih.textContent = tarihFormatla(yorum.created_at);

    const metin = document.createElement("p");
    metin.className = "yorum-metni";
    metin.textContent = yorum.comment;

    ust.append(isim, tarih);
    kart.append(ust, metin);

    return kart;
  }

  async function yorumlariYukle(istemci, filmId) {
    yorumListesi.replaceChildren();

    const { data, error } = await istemci
      .from("movie_comments")
      .select("id,movie_id,name,comment,created_at")
      .eq("movie_id", String(filmId))
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Yorumları yükleme hatası:", error);

      const hata = document.createElement("p");
      hata.className = "durum";
      hata.textContent =
        "Yorumlar yüklenemedi. Supabase yorum tablosunu ve izinlerini kontrol et.";
      yorumListesi.append(hata);
      return;
    }

    if (!data || data.length === 0) {
      const bos = document.createElement("p");
      bos.className = "durum";
      bos.textContent = "Henüz yorum yok. İlk yorumu sen yaz!";
      yorumListesi.append(bos);
      return;
    }

    const parca = document.createDocumentFragment();

    data.forEach(function (yorum) {
      parca.append(yorumKartiniEkle(yorum));
    });

    yorumListesi.append(parca);
  }

  try {
    const parametreler = new URLSearchParams(location.search);
    const filmId = parametreler.get("id");

    if (!filmId) {
      throw new Error("Film numarası bulunamadı. Film arşivine dön.");
    }

    if (
      !window.supabase ||
      !window.SUPABASE_URL ||
      !window.SUPABASE_PUBLISHABLE_KEY
    ) {
      throw new Error(
        "Supabase ayarları yüklenemedi. Bağlantı dosyasını kontrol et."
      );
    }

    const istemci = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const sonuc = await istemci
      .from("movies")
      .select("id,title,youtube,genre,year,rating,poster,description")
      .eq("id", filmId)
      .maybeSingle();

    if (sonuc.error) throw sonuc.error;

    const film = sonuc.data;

    if (!film) {
      throw new Error("Bu film bulunamadı veya görüntüleme izni yok.");
    }

    baslik.textContent = film.title || "İsimsiz film";

    const detaylar = [];
    if (film.year) detaylar.push(String(film.year));
    if (film.genre) detaylar.push(film.genre);

    if (
      film.rating !== null &&
      film.rating !== undefined &&
      film.rating !== ""
    ) {
      detaylar.push("★ " + film.rating);
    }

    detay.textContent = detaylar.join(" · ");
    aciklama.textContent = film.description || "";

    if (film.poster) {
      afis.src = film.poster;
      afis.hidden = false;

      afis.onerror = function () {
        afis.hidden = true;
      };
    }

    const videoId = youtubeVideoId(film.youtube);

    if (videoId) {
      const iframe = document.createElement("iframe");
      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId);
      iframe.title = (film.title || "Film") + " video oynatıcı";
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      videoKapsayici.replaceChildren(iframe);
    } else {
      const mesaj = document.createElement("p");
      mesaj.className = "durum";
      mesaj.textContent =
        "Geçerli bir YouTube bağlantısı bulunamadı. Yönetim panelinden film bağlantısını kontrol et.";
      videoKapsayici.replaceChildren(mesaj);
    }

    durum.hidden = true;
    icerik.hidden = false;
    document.title = (film.title || "Film İzle") + " | BengüşFlix";

    // Yorumları getir
    await yorumlariYukle(istemci, film.id);

    // Yorum gönderilince doğrudan yayınla
    yorumForm.addEventListener("submit", async function (olay) {
      olay.preventDefault();

      const isim = yorumIsim.value.trim();
      const yorum = yorumMetni.value.trim();

      if (!isim || !yorum) {
        mesajGoster("Lütfen isim ve yorum alanlarını doldur.", true);
        return;
      }

      if (isim.length > 60 || yorum.length > 1000) {
        mesajGoster("İsim en fazla 60, yorum en fazla 1000 karakter olabilir.", true);
        return;
      }

      yorumGonder.disabled = true;
      yorumGonder.textContent = "Yayınlanıyor...";
      mesajGoster("");

      try {
        const { data, error } = await istemci
          .from("movie_comments")
          .insert({
            movie_id: String(film.id),
            name: isim,
            comment: yorum
          })
          .select("id,movie_id,name,comment,created_at")
          .single();

        if (error) throw error;

        // Yeni yorumu liste başına hemen ekle
        const bosMesaj = yorumListesi.querySelector(".durum");
        if (
          bosMesaj &&
          bosMesaj.textContent.includes("Henüz yorum yok")
        ) {
          yorumListesi.replaceChildren();
        }

        yorumListesi.prepend(yorumKartiniEkle(data));
        yorumMetni.value = "";
        mesajGoster("Yorumun yayınlandı!");

      } catch (hata) {
        console.error("Yorum gönderme hatası:", hata);
        mesajGoster(
          "Yorum yayınlanamadı. Supabase tablo ve izin ayarlarını kontrol et.",
          true
        );
      } finally {
        yorumGonder.disabled = false;
        yorumGonder.textContent = "Yorumu yayınla";
      }
    });

  } catch (hata) {
    console.error("Film görüntüleme hatası:", hata);
    hataGoster("Film açılamadı: " + hata.message);
  }
})();
</script>

</body>
</html>
