```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Film İzle | BengüşFlix</title>

<style>
:root{--arka:#101014;--kart:#1b1b23;--kirmizi:#e74752;--yazi:#f6f6f8;--soluk:#aaaab6}
*{box-sizing:border-box}
body{margin:0;background:var(--arka);color:var(--yazi);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.ust-menu{background:#17171d;border-bottom:1px solid #292932}
.menu-icerik{max-width:1100px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:inline-block;color:#f6f6f8!important;font-size:25px;font-weight:900;line-height:1.3;white-space:nowrap}
.logo span{color:#e74752!important}
.geri{color:#ff737c;font-size:14px;font-weight:bold}
.ana-icerik{max-width:1100px;margin:auto;padding:30px 20px 60px}
.durum{color:var(--soluk);line-height:1.8;padding:20px 0;overflow-wrap:anywhere}
.film-baslik{font-size:clamp(27px,5vw,42px);margin:0 0 12px}
.film-detay{color:var(--soluk);font-size:14px;line-height:1.8;margin-bottom:24px}
.video-kapsayici{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid #292932}
.video-kapsayici iframe{display:block;width:100%;height:100%;border:0}
.aciklama{margin-top:25px;color:#d1d1da;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}
.afis{width:150px;max-width:40%;border-radius:8px;margin-top:25px}
.yorum-bolumu{margin-top:35px;padding-top:28px;border-top:1px solid #292932}
.yorum-baslik{font-size:25px;margin:0 0 8px}
.yorum-alt-baslik{color:var(--soluk);font-size:14px;margin:0 0 22px}
.yorum-form{background:var(--kart);border:1px solid #30303a;border-radius:12px;padding:18px;margin-bottom:25px}
.form-alan{display:block;width:100%;margin-bottom:14px}
.form-alan label{display:block;margin-bottom:8px;font-size:14px;font-weight:bold}
.form-alan input,.form-alan textarea{width:100%;padding:13px 14px;color:var(--yazi);background:#111116;border:1px solid #393943;border-radius:8px;font:inherit;outline:none}
.form-alan input:focus,.form-alan textarea:focus{border-color:var(--kirmizi)}
.form-alan textarea{min-height:110px;resize:vertical}
.yorum-gonder{display:inline-block;padding:12px 22px;background:var(--kirmizi);color:white;border:0;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
.yorum-gonder:hover{background:#ce3540}
.yorum-gonder:disabled{opacity:.6;cursor:not-allowed}
.yorum-mesaj{color:var(--soluk);font-size:14px;line-height:1.6;margin-top:12px}
.yorum-listesi{display:grid;gap:14px}
.yorum-kart{background:var(--kart);border:1px solid #292932;border-radius:10px;padding:17px;overflow-wrap:anywhere}
.yorum-ust{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.yorum-isim{font-weight:bold;color:#fff}
.yorum-tarih{color:var(--soluk);font-size:12px}
.yorum-metni{color:#d8d8e0;line-height:1.7;white-space:pre-wrap;margin:0}
.alt-bilgi{border-top:1px solid #292932;padding:25px 20px;text-align:center;color:var(--soluk);font-size:13px}
@media(max-width:600px){
.menu-icerik{align-items:flex-start;flex-direction:column}
.ana-icerik{padding:22px 14px 40px}
.video-kapsayici{border-radius:7px}
.yorum-form{padding:14px}
.yorum-ust{align-items:flex-start;flex-direction:column;gap:6px}
}
</style>
</head>

<body>
<header class="ust-menu">
  <div class="menu-icerik">
    <a class="logo" href="./index.html" aria-label="BengüşFlix ana sayfa">Bengüş<span>Flix</span></a>
    <a class="geri" href="./index.html#filmler">← Film arşivine dön</a>
  </div>
</header>

<main class="ana-icerik">
  <p class="durum" id="film-durumu">Film yükleniyor...</p>

  <section id="film-icerigi" hidden>
    <h1 class="film-baslik" id="film-baslik"></h1>
    <div class="film-detay" id="film-detay"></div>
    <div class="video-kapsayici" id="video-kapsayici"></div>
    <img class="afis" id="film-afis" alt="Film afişi" hidden>
    <p class="aciklama" id="film-aciklama"></p>

    <section class="yorum-bolumu" aria-labelledby="yorum-baslik">
      <h2 class="yorum-baslik" id="yorum-baslik">Yorumlar</h2>
      <p class="yorum-alt-baslik">Film hakkındaki düşünceni paylaş.</p>

      <form class="yorum-form" id="yorum-form">
        <div class="form-alan">
          <label for="yorum-isim">İsmin</label>
          <input id="yorum-isim" name="name" type="text" maxlength="60"
            placeholder="İsmini yaz..." autocomplete="nickname" required>
        </div>

        <div class="form-alan">
          <label for="yorum-metni">Yorumun</label>
          <textarea id="yorum-metni" name="comment" maxlength="1000"
            placeholder="Bu film hakkında ne düşünüyorsun?" required></textarea>
        </div>

        <button class="yorum-gonder" id="yorum-gonder" type="submit">Yorumu yayınla</button>
        <p class="yorum-mesaj" id="yorum-mesaj" role="status" aria-live="polite"></p>
      </form>

      <div class="yorum-listesi" id="yorum-listesi">
        <p class="durum">Yorumlar yükleniyor...</p>
      </div>
    </section>
  </section>
</main>

<footer class="alt-bilgi">© 2026 BengüşFlix</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
(async function(){
  const $ = id => document.getElementById(id);
  const durum = $("film-durumu");
  const icerik = $("film-icerigi");
  const videoKapsayici = $("video-kapsayici");
  const yorumForm = $("yorum-form");
  const yorumIsim = $("yorum-isim");
  const yorumMetni = $("yorum-metni");
  const yorumGonder = $("yorum-gonder");
  const yorumMesaj = $("yorum-mesaj");
  const yorumListesi = $("yorum-listesi");

  function hataGoster(mesaj){
    durum.hidden = false;
    durum.textContent = mesaj;
    icerik.hidden = true;
  }

  function parseHttpUrl(value){
    try{
      const url = new URL(value);
      if(url.protocol !== "https:" && url.protocol !== "http:") return null;
      return url;
    }catch(_){
      return null;
    }
  }

  // Veritabanında hangi platform bağlantısı varsa onu tanır.
  function videoBilgisi(adres){
    if(!adres || typeof adres !== "string") return null;

    const url = parseHttpUrl(adres.trim());
    if(!url) return null;

    const host = url.hostname.toLowerCase().replace(/^www\./,"");

    // Mail.ru: YouTube bağlantısı gerektirmez.
    if(
      host === "my.mail.ru" &&
      /^\/video\/embed\/\d+\/?$/.test(url.pathname)
    ){
      return {
        tur:"mailru",
        adres:url.href
      };
    }

    // YouTube
    let id = "";

    if(host === "youtu.be"){
      id = url.pathname.split("/").filter(Boolean)[0] || "";
    }else if([
      "youtube.com",
      "m.youtube.com",
      "music.youtube.com",
      "youtube-nocookie.com"
    ].includes(host)){
      if(url.pathname === "/watch"){
        id = url.searchParams.get("v") || "";
      }else{
        const parts = url.pathname.split("/").filter(Boolean);
        if(["embed","shorts","live"].includes(parts[0])){
          id = parts[1] || "";
        }
      }
    }

    if(/^[A-Za-z0-9_-]{11}$/.test(id)){
      return {
        tur:"youtube",
        adres:"https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id)
      };
    }

    return null;
  }

  function mesajGoster(metin,hata=false){
    yorumMesaj.textContent = metin;
    yorumMesaj.style.color = hata ? "#ff737c" : "var(--soluk)";
  }

  function tarihFormatla(tarih){
    if(!tarih) return "";
    const d = new Date(tarih);
    if(Number.isNaN(d.getTime())) return "";
    return d.toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"});
  }

  function yorumKarti(yorum){
    const kart = document.createElement("article");
    kart.className = "yorum-kart";

    const ust = document.createElement("div");
    ust.className = "yorum-ust";

    const isim = document.createElement("span");
    isim.className = "yorum-isim";
    isim.textContent = yorum.name || "İsimsiz";

    const tarih = document.createElement("time");
    tarih.className = "yorum-tarih";
    tarih.textContent = tarihFormatla(yorum.created_at);

    const metin = document.createElement("p");
    metin.className = "yorum-metni";
    metin.textContent = yorum.comment || "";

    ust.append(isim,tarih);
    kart.append(ust,metin);
    return kart;
  }

  async function yorumlariYukle(client,filmId){
    yorumListesi.replaceChildren();

    const {data,error} = await client
      .from("movie_comments")
      .select("id,movie_id,name,comment,created_at")
      .eq("movie_id",String(filmId))
      .order("created_at",{ascending:false});

    if(error){
      console.error("Yorum yükleme hatası:",error);
      const p = document.createElement("p");
      p.className = "durum";
      p.textContent = "Yorumlar yüklenemedi. Supabase tablo ve izinlerini kontrol et.";
      yorumListesi.append(p);
      return;
    }

    if(!data || data.length === 0){
      const p = document.createElement("p");
      p.className = "durum";
      p.textContent = "Henüz yorum yok. İlk yorumu sen yaz!";
      yorumListesi.append(p);
      return;
    }

    const frag = document.createDocumentFragment();
    data.forEach(yorum => frag.append(yorumKarti(yorum)));
    yorumListesi.append(frag);
  }

  try{
    const params = new URLSearchParams(location.search);
    const filmId = params.get("id");

    if(!filmId){
      throw new Error("Film numarası bulunamadı. Film arşivine dön.");
    }

    if(!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY){
      throw new Error("Supabase ayarları yüklenemedi. supabase-config.js dosyasını kontrol et.");
    }

    const client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const {data:film,error} = await client
      .from("movies")
      .select("id,title,youtube,genre,year,rating,poster,description")
      .eq("id",filmId)
      .maybeSingle();

    if(error) throw error;
    if(!film) throw new Error("Bu film bulunamadı veya görüntüleme izni yok.");

    $("film-baslik").textContent = film.title || "İsimsiz film";

    const meta = [];
    if(film.year) meta.push(String(film.year));
    if(film.genre) meta.push(film.genre);
    if(film.rating !== null && film.rating !== undefined && film.rating !== ""){
      meta.push("★ " + film.rating);
    }
    $("film-detay").textContent = meta.join(" · ");
    $("film-aciklama").textContent = film.description || "";

    if(film.poster && parseHttpUrl(film.poster)){
      $("film-afis").src = film.poster;
      $("film-afis").hidden = false;
      $("film-afis").onerror = () => {$("film-afis").hidden = true;};
    }else{
      $("film-afis").hidden = true;
    }

    // Platform, veritabanındaki video bağlantısından otomatik belirlenir.
    const video = videoBilgisi(film.youtube);
    videoKapsayici.replaceChildren();

    if(video){
      const iframe = document.createElement("iframe");
      iframe.src = video.adres;
      iframe.title = (film.title || "Film") + " video oynatıcı";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      videoKapsayici.append(iframe);
    }else{
      const p = document.createElement("p");
      p.className = "durum";
      p.style.padding = "20px";
      p.textContent = film.youtube
        ? "Video bağlantısı tanınamadı. Yönetim panelinden YouTube veya Mail.ru bağlantısını kontrol edip kaydet."
        : "Bu film için henüz video bağlantısı girilmemiş. Yönetim panelinden YouTube veya Mail.ru seçip bağlantıyı kaydet.";
      videoKapsayici.append(p);
    }

    durum.hidden = true;
    icerik.hidden = false;
    document.title = (film.title || "Film İzle") + " | BengüşFlix";

    await yorumlariYukle(client,film.id);

    yorumForm.addEventListener("submit",async function(event){
      event.preventDefault();

      const name = yorumIsim.value.trim();
      const comment = yorumMetni.value.trim();

      if(!name || !comment){
        mesajGoster("Lütfen isim ve yorum alanlarını doldur.",true);
        return;
      }

      if(name.length > 60 || comment.length > 1000){
        mesajGoster("İsim en fazla 60, yorum en fazla 1000 karakter olabilir.",true);
        return;
      }

      yorumGonder.disabled = true;
      yorumGonder.textContent = "Yayınlanıyor...";
      mesajGoster("");

      try{
        const {data,error} = await client
          .from("movie_comments")
          .insert({
            movie_id:String(film.id),
            name,
            comment
          })
          .select("id,movie_id,name,comment,created_at")
          .single();

        if(error) throw error;

        const empty = yorumListesi.querySelector(".durum");
        if(empty) yorumListesi.replaceChildren();

        yorumListesi.prepend(yorumKarti(data));
        yorumMetni.value = "";
        mesajGoster("Yorumun yayınlandı!");
      }catch(error){
        console.error("Yorum gönderme hatası:",error);
        mesajGoster("Yorum yayınlanamadı. Supabase tablo ve izinlerini kontrol et.",true);
      }finally{
        yorumGonder.disabled = false;
        yorumGonder.textContent = "Yorumu yayınla";
      }
    });

  }catch(error){
    console.error("Film görüntüleme hatası:",error);
    hataGoster("Film açılamadı: " + error.message);
  }
})();
</script>
</body>
</html>
