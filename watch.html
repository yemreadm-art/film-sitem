
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Film İzle | BengüşFlix</title>

<style>
:root {
  --arka: #101014;
  --kart: #1b1b23;
  --kirmizi: #e74752;
  --yazi: #f6f6f8;
  --soluk: #aaaab6;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--arka);
  color: var(--yazi);
  font-family: Arial, Helvetica, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.ust-menu {
  background: #17171d;
  border-bottom: 1px solid #292932;
}

.menu-icerik {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
}

.logo span { color: var(--kirmizi); }

.geri {
  color: #ff737c;
  font-size: 14px;
  font-weight: bold;
}

.ana-icerik {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px 60px;
}

.durum {
  color: var(--soluk);
  line-height: 1.8;
  padding: 20px 0;
}

.film-baslik {
  font-size: clamp(27px, 5vw, 42px);
  margin: 0 0 12px;
}

.film-detay {
  color: var(--soluk);
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 24px;
}

.video-kapsayici {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #292932;
}

.video-kapsayici iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.aciklama {
  margin-top: 25px;
  color: #d1d1da;
  line-height: 1.8;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.afis {
  width: 150px;
  max-width: 40%;
  border-radius: 8px;
  margin-top: 25px;
}

.alt-bilgi {
  border-top: 1px solid #292932;
  padding: 25px 20px;
  text-align: center;
  color: var(--soluk);
  font-size: 13px;
}

@media (max-width: 600px) {
  .menu-icerik {
    align-items: flex-start;
    flex-direction: column;
  }

  .ana-icerik {
    padding: 22px 14px 40px;
  }

  .video-kapsayici {
    border-radius: 7px;
  }
}
</style>
</head>

<body>

<header class="ust-menu">
  <div class="menu-icerik">
    <a class="logo" href="./index.html">
      Bengüş<span>Flix</span>
    </a>

    <a class="geri" href="./index.html#filmler">
      ← Film arşivine dön
    </a>
  </div>
</header>

<main class="ana-icerik">
  <p class="durum" id="film-durumu">Film yükleniyor...</p>

  <section id="film-icerigi" hidden>
    <h1 class="film-baslik" id="film-baslik"></h1>
    <div class="film-detay" id="film-detay"></div>

    <div class="video-kapsayici" id="video-kapsayici"></div>

    <img class="afis" id="film-afis" alt="Film afişi" hidden>

    <p class="aciklama" id="film-aciklama"></p>
  </section>
</main>

<footer class="alt-bilgi">
  © 2026 BengüşFlix
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
(async function () {
  const durum = document.getElementById("film-durumu");
  const icerik = document.getElementById("film-icerigi");
  const baslik = document.getElementById("film-baslik");
  const detay = document.getElementById("film-detay");
  const videoKapsayici = document.getElementById("video-kapsayici");
  const afis = document.getElementById("film-afis");
  const aciklama = document.getElementById("film-aciklama");

  function hataGoster(mesaj) {
    durum.hidden = false;
    durum.textContent = mesaj;
    icerik.hidden = true;
  }

  function youtubeVideoId(adres) {
    if (!adres) return null;

    try {
      const url = new URL(adres);
      const host = url.hostname.toLowerCase().replace(/^www\./, "");
      let id = "";

      if (host === "youtu.be") {
        id = url.pathname.split("/").filter(Boolean)[0] || "";
      } else if (
        host === "youtube.com" ||
        host === "m.youtube.com" ||
        host === "youtube-nocookie.com"
      ) {
        if (url.pathname === "/watch") {
          id = url.searchParams.get("v") || "";
        } else {
          const parcalar = url.pathname.split("/").filter(Boolean);

          if (["embed", "shorts", "live"].includes(parcalar[0])) {
            id = parcalar[1] || "";
          }
        }
      }

      return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
    } catch (_) {
      return null;
    }
  }

  try {
    const parametreler = new URLSearchParams(location.search);
    const filmId = parametreler.get("id");

    if (!filmId) {
      throw new Error("Film numarası bulunamadı. Film arşivine dön.");
    }

    if (
      !window.supabase ||
      !window.SUPABASE_URL ||
      !window.SUPABASE_PUBLISHABLE_KEY
    ) {
      throw new Error(
        "Supabase ayarları yüklenemedi. Bağlantı dosyasını kontrol et."
      );
    }

    // Çalışan sistemdeki Supabase ayarları aynen korunur.
    const istemci = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const sonuc = await istemci
      .from("movies")
      .select("id,title,youtube,genre,year,rating,poster,description")
      .eq("id", filmId)
      .maybeSingle();

    if (sonuc.error) throw sonuc.error;

    const film = sonuc.data;

    if (!film) {
      throw new Error("Bu film bulunamadı veya görüntüleme izni yok.");
    }

    baslik.textContent = film.title || "İsimsiz film";

    const detaylar = [];
    if (film.year) detaylar.push(String(film.year));
    if (film.genre) detaylar.push(film.genre);

    if (
      film.rating !== null &&
      film.rating !== undefined &&
      film.rating !== ""
    ) {
      detaylar.push("★ " + film.rating);
    }

    detay.textContent = detaylar.join(" · ");
    aciklama.textContent = film.description || "";

    if (film.poster) {
      afis.src = film.poster;
      afis.hidden = false;
      afis.onerror = function () {
        afis.hidden = true;
      };
    }

    const videoId = youtubeVideoId(film.youtube);

    if (videoId) {
      const iframe = document.createElement("iframe");

      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId);

      iframe.title = (film.title || "Film") + " video oynatıcı";
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";

      videoKapsayici.replaceChildren(iframe);
    } else {
      const mesaj = document.createElement("p");
      mesaj.className = "durum";
      mesaj.textContent =
        "Geçerli bir YouTube bağlantısı bulunamadı. Yönetim panelinden film bağlantısını kontrol et.";

      videoKapsayici.replaceChildren(mesaj);
    }

    durum.hidden = true;
    icerik.hidden = false;
    document.title = (film.title || "Film İzle") + " | BengüşFlix";

  } catch (hata) {
    console.error("Film görüntüleme hatası:", hata);
    hataGoster("Film açılamadı: " + hata.message);
  }
})();
</script>

</body>
</html>
